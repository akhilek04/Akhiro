<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1E33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Akhiro – Deutsch sprechen</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="chip-btn" id="profileChip" aria-label="Profil wechseln">
      <span class="avatar" id="chipAvatar">?</span><span id="chipName">Profil</span>
    </button>
    <div class="pills">
      <span class="pill today" id="pillToday" title="Heute gesprochen"></span>
      <span class="pill streak" id="pillStreak" title="Tage in Folge"></span>
    </div>
  </header>

  <main id="main">
    <section class="view active" id="view-home"></section>
    <section class="view" id="view-progress"></section>
    <section class="view" id="view-memory"></section>
    <section class="view" id="view-profile"></section>
  </main>

  <nav class="tabbar">
    <button data-view="home" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>Start</button>
    <button data-view="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Fortschritt</button>
    <button data-view="memory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M4 17a2 2 0 0 1 2-2h12"/><path d="M9 7h5"/></svg>Gedächtnis</button>
    <button data-view="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</button>
  </nav>
</div>

<!-- Talk screen -->
<div class="overlay hidden" id="talk">
  <div class="ohead">
    <button class="x" id="talkClose" aria-label="Beenden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span class="timer" id="talkTimer">0:00</span>
    <span class="tag ai" id="talkMode">Tippen</span>
  </div>
  <div class="obody" id="talkBody">
    <div class="stage">
      <div class="buddy">
        <div class="halo" id="halo"></div>
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="54" fill="#0B1E33"/>
          <ellipse cx="44" cy="52" rx="7" ry="9" fill="#fff"/>
          <ellipse cx="76" cy="52" rx="7" ry="9" fill="#fff"/>
          <circle cx="45" cy="54" r="3.4" fill="#2A2233"/>
          <circle cx="77" cy="54" r="3.4" fill="#2A2233"/>
          <path id="mouth" d="M44 76 Q60 88 76 76" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
          <circle cx="33" cy="70" r="6" fill="#F28C28" opacity=".85"/>
          <circle cx="87" cy="70" r="6" fill="#F28C28" opacity=".85"/>
        </svg>
      </div>
      <div class="status" id="talkStatus">Verbinde …</div>
    </div>
    <div class="transcript" id="transcript"></div>
  </div>
  <div class="ofoot">
    <div class="talk-controls">
      <button class="btn big" id="talkMain">Tippen &amp; sprechen</button>
      <button class="btn big ghost" id="talkEnd" style="flex:0 0 auto">Fertig</button>
    </div>
    <div class="typebar">
      <input type="text" id="typeInput" placeholder="Schreiben statt sprechen …" autocomplete="off">
      <button class="btn small dark" id="typeSend">Senden</button>
    </div>
  </div>
</div>

<!-- Result screen -->
<div class="overlay hidden" id="result">
  <div class="ohead"><h2 id="resultTitle">Auswertung</h2><span></span></div>
  <div class="obody" id="resultBody"></div>
  <div class="ofoot"><button class="btn block big" id="resultDone">Weiter</button></div>
</div>

<!-- Profiles / onboarding -->
<div class="overlay hidden" id="people">
  <div class="ohead"><h2 id="peopleTitle">Wer übt heute?</h2><button class="x" id="peopleClose" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="obody" id="peopleBody"></div>
</div>

<div class="toast" id="toast"></div>
<div class="tooltip" id="tip"></div>
<script src="app.js"></script>
</body>
</html>
